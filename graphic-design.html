<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphic Design Work | Brianna Wille</title>
    <meta name="description" content="Graphic design portfolio work by Brianna Wille.">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Belleza&family=Dancing+Script:wght@400..700&family=Give+You+Glory&family=Instrument+Serif:ital@0;1&family=Momo+Signature&display=swap" rel="stylesheet">
    <link href="./styles/style.css" rel="stylesheet">
</head>
<body>
    <nav class="site-nav" aria-label="Primary navigation">
        <a href="index.html#home">Home</a>
        <a href="index.html#work" aria-current="page">My Work</a>
        <a href="index.html#about">About Me</a>
        <a href="index.html#contact">Contact</a>
    </nav>

    <main class="portfolio-page graphic-design-page">
        <section class="portfolio-hero">
            <a class="back-link" href="index.html#work">Back To Work</a>
            <h1>Graphic Design</h1>
        </section>

        <section class="graphic-showcase" aria-label="Graphic design case studies">
            <div class="case-study case-study-feature">
                <div class="browser-mockup">
                    <div class="browser-bar">
                        <span></span>
                        <span></span>
                        <span></span>
                        <div class="browser-url"></div>
                    </div>
                    <div class="browser-art cyclist-art">
                        <img src="images/graphicdesigndesktop.webp" alt="Desktop graphic design project preview">
                        <div class="browser-ribbon">american cyclist association</div>
                        <div class="browser-tabs">
                            <span>bike rides</span>
                            <span>cycling routes</span>
                            <span>events</span>
                            <span>social</span>
                        </div>
                    </div>
                </div>

                <div class="phone-mockup">
                    <div class="phone-speaker"></div>
                    <img src="images/Graphicmobile.webp" alt="Mobile graphic design project preview">
                </div>

                <h2>Case Study</h2>
            </div>

            <div class="espresso-divider">
                <img src="images/brithumbnail.webp" alt="Brianna Wille brand thumbnail">
            </div>

            <div class="case-study case-study-split">
                <div class="case-label">Case Study</div>

                <div class="browser-mockup small-browser">
                    <div class="browser-bar">
                        <span></span>
                        <span></span>
                        <span></span>
                        <div class="browser-url"></div>
                    </div>
                    <div class="browser-art">
                        <img src="images/packagedesign.webp" alt="Package design preview">
                    </div>
                </div>

                <div class="brand-board">
                    <div class="brand-corner"></div>
                    <img src="images/systemwhtitesheep.webp" alt="White sheep brand system preview" class="brand-system-image">
                </div>
            </div>
        </section>
    </main>
</body>
</html>
