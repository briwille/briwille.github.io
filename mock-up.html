<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock-Up Work | Brianna Wille</title>
    <meta name="description" content="Mock-up portfolio work by Brianna Wille.">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Belleza&family=Dancing+Script:wght@400..700&family=Give+You+Glory&family=Instrument+Serif:ital@0;1&family=Momo+Signature&display=swap" rel="stylesheet">
    <link href="./styles/style.css" rel="stylesheet">
</head>
<body>
    <nav class="site-nav" aria-label="Primary navigation">
        <a href="index.html#home">Home</a>
        <a href="index.html#work" aria-current="page">My Work</a>
        <a href="index.html#about">About Me</a>
        <a href="index.html#contact">Contact</a>
    </nav>

    <main class="portfolio-page">
        <section class="portfolio-hero">
            <a class="back-link" href="index.html#work">Back To Work</a>
            <h1>Mock-Up</h1>
        </section>

        <section class="upload-work" aria-labelledby="upload-title">
            <div class="upload-copy">
                <h2 id="upload-title">Upload Work</h2>
                <p>Add product mockups, packaging concepts, campaign visuals, or branded scenes here to preview your mock-up work.</p>
            </div>

            <label class="upload-dropzone">
                <input id="workUpload" type="file" accept="image/*" multiple>
                <span>Choose Images</span>
            </label>
        </section>

        <section class="social-gallery" id="workGallery" aria-label="Mock-up work gallery">
            <article class="gallery-card placeholder-card">
                <span>Upload images to preview your mock-up work here.</span>
            </article>
        </section>
    </main>

    <script>
        const uploadInput = document.querySelector("#workUpload");
        const gallery = document.querySelector("#workGallery");
        const placeholder = "Upload images to preview your mock-up work here.";

        uploadInput.addEventListener("change", () => {
            const files = Array.from(uploadInput.files).filter((file) => file.type.startsWith("image/"));

            gallery.innerHTML = "";

            if (!files.length) {
                gallery.innerHTML = `<article class="gallery-card placeholder-card"><span>${placeholder}</span></article>`;
                return;
            }

            files.forEach((file) => {
                const card = document.createElement("article");
                const image = document.createElement("img");
                const caption = document.createElement("p");

                card.className = "gallery-card";
                image.src = URL.createObjectURL(file);
                image.alt = file.name.replace(/\.[^/.]+$/, "");
                caption.textContent = file.name;

                card.append(image, caption);
                gallery.append(card);
            });
        });
    </script>
</body>
</html>
